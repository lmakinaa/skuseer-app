services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm --spi-theme-cache-themes=false --spi-theme-cache-templates=false --spi-theme-static-max-age=-1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak is exposed to the browser at https://stock-seer.com/auth via Caddy
      # (Cloudflare -> Caddy :443 -> this container). It is NOT reachable on :8180
      # publicly (Cloudflare doesn't proxy that port), so everything is path-routed
      # under /auth on the single 443 origin.
      KC_HTTP_RELATIVE_PATH: /auth
      # Trust X-Forwarded-* from Caddy so issuer/discovery URLs are built as
      # https://stock-seer.com/auth/... instead of the internal http://...:8080.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/stockseer-realm.json:/opt/keycloak/data/import/stockseer-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      - stockseer

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
      - backend_data:/app/data
    environment:
      # DB file lives inside the backend_data named volume so it persists across
      # container rebuilds and `docker compose down`.
      DATABASE_URL: sqlite:////app/data/stockseer.db
      # KEYCLOAK_URL: used for backend->keycloak JWKS fetch (docker network DNS).
      # Includes /auth because KC_HTTP_RELATIVE_PATH=/auth moves every endpoint
      # under that prefix. JWKS => http://keycloak:8080/auth/realms/stockseer/...
      KEYCLOAK_URL: http://keycloak:8080/auth
      # KEYCLOAK_ISSUER_URL: used to validate the `iss` claim in tokens.
      # MUST match what the browser used to obtain the token. Tokens are minted
      # via https://demo.skuseer.com/auth, so iss = https://demo.skuseer.com/auth/realms/stockseer.
      KEYCLOAK_ISSUER_URL: https://demo.skuseer.com/auth
      KEYCLOAK_REALM: stockseer
      KEYCLOAK_CLIENT_ID: stockseer-frontend
      SEER_ENGINE_URL: http://seer-engine:8001
    networks:
      - stockseer

  seer-engine:
    build:
      context: ./seer-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - stockseer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NOTE: VITE_* vars are inlined into the JS bundle at BUILD time (this is now a
      # production `vite build`, served as static files by nginx — not the dev server).
      # They must be browser-reachable URLs routed through Caddy on the 443 origin,
      # NOT docker service names and NOT the unproxied :8000/:8180 ports.
      args:
        VITE_API_URL: https://demo.skuseer.com
        VITE_KEYCLOAK_URL: https://demo.skuseer.com/auth
        VITE_KEYCLOAK_REALM: stockseer
        VITE_KEYCLOAK_CLIENT_ID: stockseer-frontend
    ports:
      - "8080:8080"
    networks:
      - stockseer

networks:
  stockseer:
    driver: bridge

volumes:
  keycloak_data:
  backend_data:
